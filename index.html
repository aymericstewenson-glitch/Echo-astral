<script>

window.addEventListener('unhandledrejection', function(e) {
  document.getElementById('loading').style.display='none';
  document.getElementById('btn-generate').disabled=false;
  var msg=e.reason?(e.reason.message||String(e.reason)):'Erreur inconnue';
  document.getElementById('result-block').style.display='block';
  document.getElementById('form-block').style.display='none';
  var ia=document.getElementById('ia-analysis-container');
  if(ia) ia.innerHTML='<div style="background:rgba(180,40,40,0.3);border:2px solid #ff5555;padding:20px;"><p style="color:#ffaaaa;font-weight:bold;">Erreur JS : '+msg+'</p></div>';
});

<style>
  :root {
    --bg: #09090f;
    --surface: rgba(20,20,35,0.75);
    --gold: #c9a84c;
    --gold-light: #e8d5a0;
    --gold-glow: rgba(201,168,76,0.25);
    --text: #dce4ed;
    --muted: #7a8a98;
    --accent: #4a3f6b;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: radial-gradient(ellipse at 20% 0%, #16182e 0%, #09090f 60%);
    color: var(--text);
    min-height: 100vh;
    padding: 50px 20px;
    line-height: 1.9;
  }

  /* ---- Étoiles ---- */
  body::before {
    content: '';
    position: fixed; top:0; left:0; width:100%; height:100%; z-index:0;
    background-image:
      radial-gradient(1px 1px at 15% 10%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 45% 5%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1.5px 1.5px at 75% 15%, rgba(255,255,255,0.7), transparent),
      radial-gradient(1px 1px at 90% 35%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 25% 55%, rgba(255,255,255,0.3), transparent),
      radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,255,0.5), transparent),
      radial-gradient(1px 1px at 10% 80%, rgba(255,255,255,0.4), transparent),
      radial-gradient(1px 1px at 85% 85%, rgba(255,255,255,0.6), transparent),
      radial-gradient(1px 1px at 35% 90%, rgba(255,255,255,0.3), transparent);
    pointer-events: none;
  }

  .container {
    max-width: 850px;
    margin: 0 auto;
    position: relative; z-index:1;
  }

  /* ---- Header ---- */
  .site-header { text-align: center; margin-bottom: 15px; }
  .site-header h1 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    font-size: clamp(2.8em, 7vw, 4.5em);
    color: var(--gold);
    letter-spacing: 6px;
    text-shadow: 0 0 40px var(--gold-glow), 0 0 80px rgba(201,168,76,0.1);
  }
  .site-header .subtitle {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    font-size: 1.2em;
    color: var(--muted);
    letter-spacing: 3px;
    margin-top: 8px;
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 30px 0;
    opacity: 0.6;
  }

  /* ---- Carte formulaire ---- */
  .card {
    background: var(--surface);
    backdrop-filter: blur(16px);
    border: 1px solid rgba(201,168,76,0.18);
    border-radius: 2px;
    padding: 45px 50px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
    margin-bottom: 35px;
  }

  .form-section-title {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 0.85em;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    opacity: 0.7;
    margin: 30px 0 20px;
    border-bottom: 1px solid rgba(201,168,76,0.15);
    padding-bottom: 8px;
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  @media(max-width:600px){ .form-row { grid-template-columns: 1fr; } }

  .form-group { margin-bottom: 28px; }

  label {
    display: block;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: var(--gold-light);
    font-size: 1em;
    letter-spacing: 1px;
    margin-bottom: 10px;
    opacity: 0.9;
  }

  input, select, textarea {
    width: 100%;
    padding: 10px 0;
    border: none;
    border-bottom: 1px solid rgba(255,255,255,0.15);
    background: transparent;
    color: var(--text);
    font-size: 1rem;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    transition: border-color 0.3s;
    -webkit-appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-bottom-color: var(--gold);
  }
  input::placeholder, textarea::placeholder { color: rgba(122,138,152,0.5); font-style: italic; }
  select option { background: #111; color: var(--text); }
  textarea { resize: vertical; min-height: 55px; }

  /* ---- Bouton principal ---- */
  .btn-reveal {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    padding: 16px 30px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    margin-top: 15px;
    transition: all 0.4s;
  }
  .btn-reveal:hover { background: var(--gold); color: #000; box-shadow: 0 0 30px var(--gold-glow); }
  .btn-reveal:disabled { border-color: var(--muted); color: var(--muted); cursor: not-allowed; }

  /* ---- Loading ---- */
  #loading {
    display: none; text-align: center;
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic; color: var(--muted);
    margin: 25px 0; font-size: 1.1em;
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

  /* ---- Bloc résultats ---- */
  #result-block { display: none; }

  .result-header {
    text-align: center;
    padding: 40px 0 20px;
  }
  .result-header .name {
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(1.6em, 4vw, 2.4em);
    color: var(--gold);
    letter-spacing: 4px;
  }
  .result-header .date-info {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: var(--muted);
    font-size: 1.1em;
    margin-top: 6px;
  }

  /* ---- Résumé rapide ---- */
  .signs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px,1fr));
    gap: 15px;
    margin: 25px 0;
  }
  .sign-card {
    background: var(--surface);
    border: 1px solid rgba(201,168,76,0.15);
    padding: 18px;
    text-align: center;
    border-radius: 2px;
  }
  .sign-card .sign-emoji { font-size: 2em; display: block; margin-bottom: 6px; }
  .sign-card .sign-label {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: var(--muted);
    font-size: 0.75em;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .sign-card .sign-name { color: var(--gold-light); font-weight: 400; font-size: 1em; margin-top: 3px; }

  /* ---- Navigation onglets ---- */
  .tabs-nav {
    display: flex;
    flex-wrap: wrap;
    gap: 0;
    border-bottom: 1px solid rgba(201,168,76,0.2);
    margin: 30px 0 0;
  }
  .tab-btn {
    background: none;
    border: none;
    color: var(--muted);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 0.78em;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 14px;
    cursor: pointer;
    transition: color 0.2s;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    flex: 1 1 auto;
    text-align: center;
  }
  .tab-btn:hover { color: var(--gold-light); }
  .tab-btn.active { color: var(--gold); border-bottom: 2px solid var(--gold); }

  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  /* ---- Contenu onglets ---- */
  .oracle-section {
    background: var(--surface);
    border: 1px solid rgba(201,168,76,0.1);
    padding: 30px 35px;
    margin-top: 20px;
    border-radius: 2px;
  }
  .oracle-section h3 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    color: var(--gold);
    font-size: 1.3em;
    margin-bottom: 15px;
    letter-spacing: 1px;
  }
  .oracle-section p { margin-bottom: 12px; color: var(--text); }
  .oracle-section strong { color: var(--gold-light); font-weight: 400; }

  .duo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
  @media(max-width:550px){ .duo-grid { grid-template-columns: 1fr; } }

  .trait-card {
    background: rgba(10,10,20,0.5);
    border: 1px solid rgba(201,168,76,0.12);
    padding: 16px 20px;
    border-radius: 2px;
  }
  .trait-card h4 {
    font-family: Georgia, 'Times New Roman', serif;
    font-style: italic;
    color: var(--gold);
    font-size: 0.9em;
    margin-bottom: 8px;
  }

  .luck-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap: 10px; margin-top: 15px;
  }
  .luck-item {
    background: rgba(10,10,20,0.5); border: 1px solid rgba(201,168,76,0.12);
    padding: 12px; text-align: center; border-radius: 2px; font-size: 0.88em;
  }
  .luck-item strong { display: block; color: var(--gold); margin-bottom: 4px; font-size: 0.85em; letter-spacing: 1px; }

  /* ---- Analyse IA ---- */
  #ia-analysis-container {
    background: var(--surface);
    border: 1px solid rgba(201,168,76,0.2);
    padding: 45px 50px;
    margin-top: 30px;
    font-size: 1.05em;
    line-height: 1.95;
    overflow-wrap: break-word;
    word-break: break-word;
    max-width: 100%;
    overflow-x: hidden;
  }
  #ia-analysis-container h2, #ia-analysis-container h3 {
    font-family: Georgia, 'Times New Roman', serif;
    font-weight: 400;
    color: var(--gold);
    margin-top: 30px;
    border-bottom: 1px solid rgba(201,168,76,0.15);
    padding-bottom: 10px;
    letter-spacing: 1px;
  }
  #ia-analysis-container table {
    width: 100%;
    border-collapse: collapse;
    margin: 20px 0;
    table-layout: fixed;
    font-size: 0.9em;
  }
  #ia-analysis-container th, #ia-analysis-container td {
    padding: 10px 8px;
    border: 1px solid rgba(201,168,76,0.25);
    text-align: left;
    word-break: break-word;
    overflow-wrap: anywhere;
    vertical-align: top;
  }
  #ia-analysis-container th { background: rgba(201,168,76,0.08); color: var(--gold); font-family: Georgia, 'Times New Roman', serif; }
  /* Schémas / blocs de code : scrollent dans leur cadre sans casser la page */
  #ia-analysis-container pre {
    background: rgba(0,0,0,0.35);
    border: 1px solid rgba(201,168,76,0.15);
    border-radius: 4px;
    padding: 12px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    font-size: 0.72em;
    line-height: 1.5;
    max-width: 100%;
  }
  #ia-analysis-container code { word-break: break-word; overflow-wrap: anywhere; }
  #ia-analysis-container p, #ia-analysis-container li { overflow-wrap: anywhere; }

  .ia-label {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: Georgia, 'Times New Roman', serif; font-style: italic;
    color: var(--muted); font-size: 0.85em; letter-spacing: 2px;
    margin-bottom: 20px; text-transform: uppercase;
  }
  .ia-label::before { content: '✦'; color: var(--gold); }

  /* ---- Bouton PDF ---- */
  .btn-pdf {
    display: none;
    background: var(--gold);
    color: #000;
    border: 1px solid var(--gold);
    padding: 15px 30px;
    font-family: Georgia, 'Times New Roman', serif;
    font-size: 1rem;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    width: 100%;
    margin-top: 30px;
    transition: all 0.3s;
  }
  .btn-pdf:hover { background: #fff; border-color: #fff; }

  /* ---- Clé d'accès ---- */
  .admin-zone {
    margin-top: 60px;
    border-top: 1px dashed rgba(255,255,255,0.08);
    padding-top: 20px;
  }
  .admin-zone label { font-size: 0.78em; color: var(--muted); font-style: normal; letter-spacing: 1px; }
  .admin-zone input { font-size: 0.85em; }

  /* ---- Adaptations mobile ---- */
  @media (max-width: 600px) {
    body { padding: 25px 12px; }
    .card { padding: 28px 22px; }
    #ia-analysis-container { padding: 28px 20px; font-size: 1em; }
    .oracle-section { padding: 22px 18px; }
    .site-header h1 { letter-spacing: 3px; }
    #ia-analysis-container table { font-size: 0.82em; }
    #ia-analysis-container th, #ia-analysis-container td { padding: 8px 6px; }
  }

  /* ---- Grille planétaire (onglet Thème Astral) ---- */
  .planet-trio {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px;
  }
  .planet-trio-card {
    background: rgba(10,10,25,0.7); border: 1px solid rgba(201,168,76,0.3);
    padding: 14px 8px; text-align: center; border-radius: 2px;
  }
  .planet-trio-card.key { border-color: var(--gold); }
  .pt-label { font-size:0.68em; letter-spacing:2px; text-transform:uppercase; color:var(--muted); margin-bottom:4px; }
  .pt-emoji { font-size:1.4em; display:block; margin-bottom:3px; }
  .pt-sign { color:var(--gold-light); font-size:0.95em; }
  .pt-deg { color:var(--muted); font-size:0.72em; margin-top:2px; }
  .planet-list { margin-top:6px; }
  .planet-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:9px 0; border-bottom:1px solid rgba(201,168,76,0.08);
    font-size:0.93em;
  }
  .planet-row:last-child { border-bottom:none; }
  .pr-left { display:flex; align-items:center; gap:10px; }
  .pr-emo { font-size:1.1em; width:24px; text-align:center; }
  .pr-name { color:var(--muted); font-size:0.78em; letter-spacing:1px; text-transform:uppercase; }
  .pr-sign { color:var(--gold-light); }
  .pr-deg { color:var(--muted); font-size:0.8em; }
  .note-meeus { font-size:0.75em; color:var(--muted); font-style:italic; text-align:center; margin-top:16px; }

  /* ---- Sélecteur de coordonnées ---- */
  .coords-note { font-size:0.78em; color:var(--muted); font-style:italic; margin-top:6px; }

  /* ---- Panneau admin ---- */
  .admin-key {
    display:flex; align-items:center; justify-content:space-between;
    background:rgba(10,10,20,0.5); border:1px solid rgba(201,168,76,0.12);
    padding:14px 16px; margin-bottom:10px; border-radius:2px; gap:12px;
  }
  .admin-key.off { opacity:0.55; border-color:rgba(224,139,139,0.2); }
  .ak-code { font-family:'Lato',sans-serif; font-size:1.05em; letter-spacing:1px; color:var(--gold-light); font-weight:400; }
  .ak-meta { font-size:0.78em; color:var(--muted); margin-top:3px; }
  .ak-actions { display:flex; gap:8px; flex-shrink:0; }
  .ak-actions button {
    background:transparent; border:1px solid var(--gold); color:var(--gold);
    padding:7px 12px; font-size:0.78em; cursor:pointer; border-radius:2px;
    font-family:'Lato',sans-serif; transition:all 0.2s; white-space:nowrap;
  }
  .ak-actions button:hover { background:var(--gold); color:#000; }
  .ak-actions button.del { border-color:rgba(224,139,139,0.5); color:#e08b8b; }
  .ak-actions button.del:hover { background:#e08b8b; color:#000; }

  /* ---- Print ---- */
  @media print {
    body { background: white; color: black; padding: 0; }
    .card, .admin-zone, .btn-pdf, .site-header .subtitle, .tabs-nav, .tab-btn { display: none !important; }
    h1 { color: black; text-shadow: none; }
    #ia-analysis-container { background: white; border: none; padding: 0; color: black; }
    #ia-analysis-container h2, #ia-analysis-container h3, th { color: black; border-color: #ccc; }
  }
</style>
<script>
window.marked={parse:function(s){
  if(!s)return'';
  var o=s;
  o=o.replace(/^### (.+)$/gm,'<h3>$1</h3>');
  o=o.replace(/^## (.+)$/gm,'<h2>$1</h2>');
  o=o.replace(/^# (.+)$/gm,'<h1>$1</h1>');
  o=o.replace(/\*\*\*(.+?)\*\*\*/g,'<strong><em>$1</em></strong>');
  o=o.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
  o=o.replace(/\*(.+?)\*/g,'<em>$1</em>');
  o=o.replace(/^[*-] (.+)$/gm,'<li>$1</li>');
  o=o.replace(/(<li>[\s\S]*?<\/li>)/g,'<ul>$1</ul>');
  o=o.replace(/^---+$/gm,'<hr>');
  o=o.replace(/\|(.+)\|/g,function(l){
    var cols=l.split('|').slice(1,-1).map(function(c){return c.trim();});
    if(cols.every(function(c){return /^[-:]+$/.test(c);}))return'';
    return '<tr>'+cols.map(function(c){return'<td style="padding:8px;border:1px solid rgba(201,168,76,0.25);">'+c+'</td>';}).join('')+'</tr>';
  });
  o=o.replace(/(<tr>[\s\S]*?<\/tr>)/g,'<table style="width:100%;border-collapse:collapse;margin:16px 0;">$1</table>');
  o=o.replace(/`(.+?)`/g,'<code>$1</code>');
  o=o.replace(/^([^<\n].+)$/gm,function(l){return l.startsWith('<')?l:'<p>'+l+'</p>';});
  return o;
}};
</script>

<body>
<div class="container">

  <header class="site-header">
    <h1>L'Écho des Astres</h1>
    <div class="subtitle">Cartographie de l'Âme · Oracle Universel · Stratégie de Vie</div>
  </header>
  <div class="divider"></div>

  <div class="card" id="form-block">

    <div class="form-section-title">Identité</div>
    <div class="form-row">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" id="prenom" placeholder="Votre prénom">
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="nom" placeholder="Votre nom">
      </div>
    </div>
    <div class="form-group">
      <label>Accords du texte (genre)</label>
      <select id="genre">
        <option value="féminin">Féminin — elle / créatrice</option>
        <option value="masculin">Masculin — il / créateur</option>
        <option value="neutre">Neutre — sans distinction</option>
      </select>
    </div>

    <div class="form-section-title">Naissance</div>
    <div class="form-row">
      <div class="form-group">
        <label>Date de naissance</label>
        <input type="date" id="birthdate">
      </div>
      <div class="form-group">
        <label>Heure exacte</label>
        <input type="time" id="birthtime">
      </div>
    </div>
    <div class="form-group">
      <label>Lieu de naissance</label>
      <input type="text" id="birthplace" placeholder="Ex : Cayenne, Guyane Française">
    </div>
    <div class="form-group">
      <label>Coordonnées <span style="font-size:0.78em; opacity:0.6;">— Nécessaires pour l'Ascendant exact</span></label>
      <select id="cityCoords" onchange="toggleManualCoords()">
        <option value="4.933,-52.317,-3">Cayenne, Guyane Française</option>
        <option value="5.170,-52.650,-3">Saint-Laurent-du-Maroni, Guyane</option>
        <option value="4.938,-52.330,-3">Kourou, Guyane</option>
        <option value="14.616,-61.058,-4">Fort-de-France, Martinique</option>
        <option value="16.241,-61.533,-4">Pointe-à-Pitre, Guadeloupe</option>
        <option value="48.853,2.350,1">Paris, France</option>
        <option value="43.297,5.381,1">Marseille, France</option>
        <option value="45.748,4.847,1">Lyon, France</option>
        <option value="5.354,-4.008,0">Abidjan, Côte d'Ivoire</option>
        <option value="-4.316,15.322,1">Brazzaville, Congo</option>
        <option value="3.848,11.502,1">Yaoundé, Cameroun</option>
        <option value="-18.910,47.536,3">Antananarivo, Madagascar</option>
        <option value="12.365,-1.533,0">Ouagadougou, Burkina Faso</option>
        <option value="5.845,-55.203,-3">Paramaribo, Suriname</option>
        <option value="custom">↳ Saisir manuellement…</option>
      </select>
    </div>
    <div id="manualCoords" style="display:none;">
      <div class="form-row">
        <div class="form-group">
          <label>Latitude (°N positif, °S négatif)</label>
          <input type="number" id="manLat" step="0.001" placeholder="ex: 4.933">
        </div>

function julianDay(yr, mo, dy, utH) {
  if(mo<=2){yr--;mo+=12;}

  return Math.floor(365.25*(yr+4716))+Math.floor(30.6001*(mo+1))+dy+B-1524.5+utH/24;

  const om=_n(125.04-1934.136*T)*_R;
  return _n(L0+C-0.00569-0.00478*Math.sin(om));
}

/* --- LUNE (Meeus Ch.47, 60 termes principaux, précision ~0.01°) --- */
function calcMoonLon(T) {
  const Lp=_n(218.3165+481267.8813*T-0.001320*T*T+T**3/538841-T**4/65194000);
  const M =_n(357.5291+35999.0503*T-0.0001559*T*T-T**3/24490000);
  const Mp=_n(134.9634+477198.8676*T+0.008997*T*T+T**3/69699-T**4/14712000);
  const F =_n(93.2721+483202.0175*T-0.003403*T*T-T**3/3526000);
  const D =_n(297.8502+445267.1115*T-0.001272*T*T+T**3/545868-T**4/113065000);
  const Om=_n(125.0445-1934.1362*T+0.002076*T*T+T**3/327270);
  const E=1-0.002516*T-0.0000074*T*T, E2=E*E;
  const tm=[
    [0,0,1,0,6288774],[2,0,-1,0,1274027],[2,0,0,0,658314],[0,0,2,0,213618],
    [0,1,0,0,-185116],[0,0,0,2,-114332],[2,0,-2,0,58793],[2,-1,-1,0,57066],
    [2,0,1,0,53322],[2,-1,0,0,45758],[0,1,-1,0,-40923],[1,0,0,0,-34720],
    [0,1,1,0,-30383],[2,0,0,-2,15327],[0,0,1,2,-12528],[0,0,1,-2,10980],
    [4,0,-1,0,10675],[0,0,3,0,10034],[4,0,-2,0,8548],[2,1,-1,0,-7888],
    [2,1,0,0,-6766],[1,0,-1,0,-5163],[1,1,0,0,4987],[2,-1,1,0,4036],
    [2,0,2,0,3994],[4,0,0,0,3861],[2,0,-3,0,3665],[0,1,-2,0,-2689],
    [2,0,-1,2,-2602],[2,-1,-2,0,2390],[1,0,1,0,-2348],[2,-2,0,0,2236],
    [0,1,2,0,-2120],[0,2,0,0,-2069],[2,-2,-1,0,2048],[2,0,1,-2,-1773],
    [2,0,0,2,-1595],[4,-1,-1,0,1215],[0,0,2,2,-1110],[3,0,-1,0,-892],
    [2,1,1,0,-810],[4,-1,-2,0,759],[0,2,-1,0,-713],[2,2,-1,0,-700],
    [2,1,-2,0,691],[2,-1,0,-2,596],[4,0,1,0,549],[0,0,4,0,537],
    [4,-1,0,0,520],[1,0,-2,0,-487],[2,1,0,-2,-399],[0,0,2,-2,-381],
    [1,1,1,0,351],[3,0,-2,0,-340],[4,0,-3,0,330],[2,-1,2,0,327],
    [0,2,1,0,-323],[1,1,-1,0,299],[2,0,3,0,294],[2,0,-1,-2,268]
  ];
  let sl=0;
  for(const[d,m,mp,f,c] of tm){
    const eE=Math.abs(m)===1?E:Math.abs(m)===2?E2:1;
    sl+=c*eE*Math.sin((d*D+m*M+mp*Mp+f*F)*_R);
  }
  sl+=3958*Math.sin(_n(119.75+131.849*T)*_R)+1962*Math.sin(_n(Lp-F)*_R)
     +318*Math.sin(_n(53.09+479264.29*T)*_R)-17200*Math.sin(Om*_R);
  return _n(Lp+sl/1e6);
}

/* --- OBLIQUITÉ (Meeus Ch.22) --- */
function calcObliquity(T) {
  return 23.4392911+(-46.8150*T-0.00059*T*T+0.001813*T**3)/3600;
}

/* --- GAST (Meeus Ch.12) --- */
function calcGast(JD, T) {
  const th0=_n(280.46061837+360.98564736629*(JD-2451545)+0.000387933*T*T-T**3/38710000);
  const Om=_n(125.0445-1934.1362*T)*_R;
  const eps=calcObliquity(T)*_R;
  const L0s=_n(280.4665+36000.7698*T)*_R;
  const L0m=_n(218.3165+481267.8813*T)*_R;
  const dPsi=(-17.20*Math.sin(Om)-1.32*Math.sin(2*L0s)-0.23*Math.sin(2*L0m))/3600;
  return (th0+dPsi*Math.cos(eps))/15;
}

/* --- ASCENDANT & MC (Meeus Ch.14, formule validée) --- */
function calcAngles(gast_h, lon, lat, T) {
  const lst=_n(gast_h*15+lon)*_R;
  const E=calcObliquity(T)*_R, phi=lat*_R;
  const asc=_n(Math.atan2(Math.cos(lst),-(Math.sin(E)*Math.tan(phi)+Math.cos(E)*Math.sin(lst)))*_D);
  const mc=_n(Math.atan2(Math.sin(lst),Math.cos(lst)*Math.cos(E))*_D);
  return {asc, mc};
}

function _hcPos(p, T) {
  const L=_n(p.L0+p.L1*T), om=_n(p.om0+p.om1*T), e=p.e0+p.e1*T;
  const M=_n(L-om)*_R;
  const C=((2*e-e**3/4)*Math.sin(M)+(5*e**2/4)*Math.sin(2*M)+(13*e**3/12)*Math.sin(3*M))*_D;
  const nu=_n(L-om+C+360);
  const r=p.a*(1-e*e)/(1+e*Math.cos(nu*_R));
  return {L:_n(L+C), r};
}

function calcGeoLon(name, T) {
  const earth=_hcPos(_PD.Terre,T), pl=_hcPos(_PD[name],T);
  const x=pl.r*Math.cos(pl.L*_R)-earth.r*Math.cos(earth.L*_R);
  const y=pl.r*Math.sin(pl.L*_R)-earth.r*Math.sin(earth.L*_R);
  return _n(Math.atan2(y,x)*_D);
}

function _normDiff(a,b){let d=Math.abs(a-b)%360;return d>180?360-d:d;}
const ASPECTS=[
 {name:"Conjonction",angle:0,orb:8,sym:"☌",sens:"fusionne et intensifie"},
 {name:"Sextile",angle:60,orb:4,sym:"⚹",sens:"facilite et harmonise"},

 {name:"Trigone",angle:120,orb:6,sym:"△",sens:"fait circuler l'énergie entre"},
 {name:"Opposition",angle:180,orb:8,sym:"☍",sens:"met en miroir et en équilibre"},
];
function detectAspects(positions){
  const found=[];
  for(let i=0;i<positions.length;i++)for(let j=i+1;j<positions.length;j++){
    const d=_normDiff(positions[i].lon,positions[j].lon);
    for(const asp of ASPECTS){
      if(Math.abs(d-asp.angle)<=asp.orb){
        found.push({a:positions[i].name,b:positions[j].name,aspect:asp.name,sym:asp.sym,sens:asp.sens,orb:Math.abs(d-asp.angle).toFixed(1)});
        break;
      }
    }
  }
  return found;
}

const ADMIN_PASSWORD = "EZPassword973"; // ← Ton mot de passe admin
const KEY_SECRET = "EchoAstres2025";   // ← Clé de signature des codes


async function _signExpiry(exp) {
  if (!window.crypto || !window.crypto.subtle) {
    // Fallback simple si crypto non disponible (ex: iframe sandbox)
    var h=0; for(var i=0;i<(exp+KEY_SECRET).length;i++){h=((h<<5)-h)+(exp+KEY_SECRET).charCodeAt(i);h|=0;}
    var hex=Math.abs(h).toString(16).toUpperCase().padStart(8,'0');
    return hex.slice(0,8);
  }
  var enc = new TextEncoder();
  var km = await crypto.subtle.importKey('raw', enc.encode(KEY_SECRET), {name:'HMAC',hash:'SHA-256'}, false, ['sign']);
  var buf = await crypto.subtle.sign('HMAC', km, enc.encode(exp + KEY_SECRET));
  return Array.from(new Uint8Array(buf)).map(function(b){return b.toString(16).padStart(2,'0');}).join('').slice(0,8).toUpperCase();
}

async function validerCle(code) {
  try {
    var c = code.trim().toUpperCase().split(' ').join('');
    var p = c.split('-');
    if (p.length !== 4 || p[0] !== 'ECHO') return {ok:false, raison:'Format invalide. Exemple: ECHO-XXXX-XXXX-YYMMDD'};
    var sig = p[1]+p[2], exp = p[3];
    if (exp !== '991231') {
      var yr=2000+parseInt(exp.slice(0,2)), mo=parseInt(exp.slice(2,4))-1, dy=parseInt(exp.slice(4,6));
      if (new Date(yr,mo,dy+1) < new Date()) return {ok:false, raison:'Cle expiree.'};
    }
    var expected = await _signExpiry(exp);
    if (sig !== expected) return {ok:false, raison:'Cle invalide. Verifie que tu as bien copie toute la cle.'};
    try { var rev=JSON.parse(localStorage.getItem('echo_revoked')||'[]'); if(rev.includes(c)) return {ok:false, raison:'Cle revoquee.'}; } catch(e2){}
    return {ok:true};
  } catch(e) { return {ok:false, raison:'Erreur: '+e.message}; }
}

/* Fonctions héritées conservées pour compatibilité (numérologie, chinois...) */

// CORRECTION : Réduction numérologique pure (avec Maîtres Nombres 11, 22, 33)
function reduceNumber(num) {
  while (num > 9 && num !== 11 && num !== 22 && num !== 33) {
    num = num.toString().split('').reduce((a, b) => a + Number(b), 0);
  }
  return num;
}

// CORRECTION : Calcul exact du chemin de vie (Jour + Mois + Année réduits séparément)
function lifePath(dateStr) {
  const [y, m, d] = dateStr.split('-');
  const sum = reduceNumber(Number(y)) + reduceNumber(Number(m)) + reduceNumber(Number(d));
  return reduceNumber(sum);
}

// CORRECTION : Table de Pythagore stricte pour les lettres (A=1, B=2... I=9, J=1... Z=8)
function letterValue(c) {
  let val = (c.charCodeAt(0) - 64) % 9;
  return val === 0 ? 9 : val;
}

function nameNumber(str) {
  let clean = str.toUpperCase().replace(/[^A-Z]/g, '');
  let sum = clean.split('').reduce((s, c) => s + letterValue(c), 0);
  return reduceNumber(sum);
}

function soulNumber(str) {
  let clean = str.toUpperCase().replace(/[^AEIOUY]/g, ''); // Voyelles
  let sum = clean.split('').reduce((s, c) => s + letterValue(c), 0);
  return reduceNumber(sum) || 1;
}

function personalityNumber(str) {
  let clean = str.toUpperCase().replace(/[AEIOUY\s]/g, '').replace(/[^A-Z]/g, ''); // Consonnes
  let sum = clean.split('').reduce((s, c) => s + letterValue(c), 0);
  return reduceNumber(sum) || 1;
}

// CORRECTION : Cycle exact des éléments chinois (basé sur le dernier chiffre de l'année)
function getChineseZodiac(year) {
  let animalIdx = (year - 4) % 12;
  if(animalIdx < 0) animalIdx += 12;
  return {
    animal: CHINESE_ANIMALS[animalIdx],
    element: CHINESE_ELEMENTS[year % 10]
  };
}

function getVedicSun(dd, mm) {
  const vd = [[4,14],[5,15],[6,15],[7,16],[8,17],[9,17],[10,17],[11,16],[12,16],[1,14],[2,13],[3,14]];
  for (let i=0; i<12; i++) {
    let sm = vd[i][0], sd = vd[i][1];
    let em = vd[(i+1)%12][0], ed = vd[(i+1)%12][1];
    if (sm < em) {
      if ((mm === sm && dd >= sd) || (mm === em && dd < ed)) return VEDIC_SIGNS[i];
    } else {
       if ((mm === 12 && dd >= sd) || (mm === 1 && dd < ed)) return VEDIC_SIGNS[i];
    }
  }
  return VEDIC_SIGNS[0];
}

function getNakshatra(date) {
  const nk=["Ashwini","Bharani","Krittika","Rohini","Mrigashira","Ardra","Punarvasu","Pushya","Ashlesha","Magha","Purva Phalguni","Uttara Phalguni","Hasta","Chitra","Swati","Vishakha","Anuradha","Jyeshtha","Mula","Purva Ashadha","Uttara Ashadha","Shravana","Dhanishta","Shatabhisha","Purva Bhadrapada","Uttara Bhadrapada","Revati"];
  let ref=new Date(Date.UTC(2000,0,6,18,14)), diff=(date-ref)/86400000;
  let lon=(diff*13.1764)%360; if(lon<0)lon+=360;
  return nk[Math.floor(lon/(360/27))%27];
}

function getCelticTree(dd, mm) {
  const cd=[[12,24],[1,21],[2,18],[3,18],[4,15],[5,13],[6,10],[7,8],[8,5],[9,2],[9,30],[10,28],[11,25]];
  for(let i=0;i<13;i++){
    let [sm,sd]=cd[i], [em,ed]=cd[(i+1)%13];
    if (sm < em) {
        if ((mm === sm && dd >= sd) || (mm === em && dd < ed)) return CELTIC_TREES[i];
    } else {
        if ((mm === 12 && dd >= sd) || (mm === 1 && dd < ed)) return CELTIC_TREES[i];

    document.getElementById('ia-retry-zone').style.display='block';
  }
}

async function _afficherLecture(code, container) {
  container.innerHTML = '<p style="color:var(--gold);text-align:center;padding:20px;">Verification...</p>';
  var res = await validerCle(code);
  if (!res.ok) {
    container.innerHTML = '<div style="background:rgba(180,40,40,0.3);border:2px solid #ff6b6b;padding:20px;">' +
      '<p style="color:#ffbbbb;font-weight:bold;">Acces refuse : ' + res.raison + '</p>' +
      '<p style="color:#aaa;font-size:0.85em;margin-top:6px;">Cle : ' + code + '</p></div>';
    document.getElementById('ia-retry-zone').style.display='block';
    return;
  }
  try {
    var md = _genererLecture();
    container.innerHTML = marked.parse(md);
    document.getElementById('ia-retry-zone').style.display='none';
  } catch(e) {
    container.innerHTML = '<div style="background:rgba(180,40,40,0.3);border:2px solid #ff6b6b;padding:20px;">' +
      '<p style="color:#ffbbbb;font-weight:bold;">Erreur : ' + e.message + '</p></div>';
  }
}

async function lancerIA() {
  const k=document.getElementById('apiKeyRetry').value.trim();
  if(!k){alert("Veuillez saisir votre clé d'accès.");return;}
  const c=document.getElementById('ia-analysis-container');
  document.getElementById('loading-ia').style.display='block';
  await _afficherLecture(k,c);
  document.getElementById('loading-ia').style.display='none';
}
function getKabbalahText(num) {
  const kab = {
    1:"Kether — Couronne divine, volonté pure, source de toute création.",
    2:"Hokhmah — Sagesse originelle, impulsion créatrice.",
    3:"Binah — Compréhension profonde, structure, matrice de l'existence.",
    4:"Hesed — Miséricorde, expansion, générosité cosmique.",
    5:"Gevurah — Rigueur, jugement, force disciplinée.",
    6:"Tiferet — Beauté, harmonie, cœur de l'Arbre de Vie.",
    7:"Netzah — Victoire, endurance, désir vital.",
    8:"Hod — Gloire, humilité, communication divine.",
    9:"Yesod — Fondation, pont entre spirituel et matériel.",
    10:"Malkuth — Royaume, réalisation dans le monde physique.",
    11:"Daath — Connaissance cachée, transmutation mystique.",
    22:"Grand Architecte — Construction sacrée du destin mondial.",
    33:"Maître Ascensionné — Amour christique, service universel."
  };
  return kab[num] || kab[1];
}

// Navigation onglets
try {
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      document.querySelectorAll('.tab-pane').forEach(function(p){p.classList.remove('active');});
      var pane = document.getElementById('pane-'+btn.dataset.tab);
      if(pane) pane.classList.add('active');
    });
  });
} catch(e) { console.warn('Tab nav:', e.message); }

// Accès admin via l'URL : ajoute #admin à la fin de l'adresse
function _checkAdminHash() {

}
window.addEventListener('hashchange', _checkAdminHash);
window.addEventListener('load', _checkAdminHash);

// Acces admin
try {
  if (typeof window.location !== 'undefined' && window.location.hash === '#admin') { ouvrirAdmin(); }

    try { if (window.location.hash === '#admin') ouvrirAdmin(); } catch(e) {}

<script>

    document.getElementById("result-block").style.display="block";

  }catch(ex){}
});
</script>
